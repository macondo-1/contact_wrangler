[project]
name = "contact-wrangler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "plotly>=7.0.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "faker>=40.38.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.15.0",
]
